server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Video creative yüklemesi için 60MB (backend MIME limiti video=50MB,
    # multipart boundary/header overhead için 10MB pay).
    client_max_body_size 60M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types application/json application/geo+json application/javascript text/css text/plain image/svg+xml;

    # SPA: tum route'lari index.html'e yonlendir
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API isteklerini backend'e proxy'le
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Yüklenen reklam/badge görselleri backend'in `uploads/` dizininden
    # serve edilir; admin SPA'i bunları kampanya/badge önizlemelerinde
    # ve detail sayfalarında <img src="/uploads/..."> ile gösterir.
    # `^~` zorunlu: aşağıdaki `~* \.(jpg|png|...)$` regex'i normalde
    # prefix match'ten önce gelir; `^~` regex değerlendirmesini durdurur
    # ve isteği backend'e proxy'ler.
    location ^~ /uploads/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
